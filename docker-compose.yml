# Local development services only (never used by tests or CI, which use
# their own throwaway databases). Data persists in the named volume.
#
#   docker compose up -d
#   # backend/.env:
#   #   MONGO_URI=mongodb://127.0.0.1:27017/nummoria_dev
#   #   REDIS_URL=redis://127.0.0.1:6379
services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  mongo_data:
